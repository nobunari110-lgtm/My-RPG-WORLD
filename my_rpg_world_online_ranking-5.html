<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MY RPG WORLD</title>
<style>
:root{color-scheme:dark;--bg:#101522;--panel:#1b2540;--gold:#ffd76a;--cyan:#71e5ff;--pink:#ff77aa}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#fff;touch-action:none}
#wrap{position:relative;width:100vw;height:100dvh;display:grid;place-items:center;background:radial-gradient(ellipse at center,#202c49,#0c101b)}
#game{position:relative;width:min(100vw,177.78vh);height:min(100dvh,56.25vw);aspect-ratio:16/9;overflow:hidden;border:1px solid #46577e;background:#121a2b;box-shadow:0 0 35px #0008}
#game:fullscreen{width:100vw;height:100dvh;max-width:none;max-height:none;aspect-ratio:auto;border:0;box-shadow:none}
#game:fullscreen canvas{width:100%;height:100%}
#game:fullscreen #topbuttons{top:max(8px,env(safe-area-inset-top));right:max(8px,env(safe-area-inset-right))}
#fullscreenBtn{min-width:42px}
canvas{display:block;width:100%;height:100%}
#hud{position:absolute;inset:0;pointer-events:none;font-size:clamp(10px,1.25vw,15px)}
.hudbox{position:absolute;background:#0b1022d9;border:1px solid #4b5c84;border-radius:10px;padding:7px 10px;backdrop-filter:blur(4px)}
#stats{left:1.2%;top:1.5%;min-width:180px;max-width:40%;line-height:1.5}
.bar{height:7px;background:#30384d;border-radius:8px;overflow:hidden;margin:2px 0 4px}.fill{height:100%;width:100%;transition:width .12s}
#money{right:1.2%;top:1.5%;color:var(--gold);font-weight:800}
#topbuttons{position:absolute;right:1.2%;top:8%;display:flex;gap:6px;pointer-events:auto}
button{font:inherit;color:#fff;border:1px solid #6076a4;border-radius:9px;background:#263656;padding:8px 11px;cursor:pointer;box-shadow:0 2px 0 #101522;touch-action:manipulation}
button:active{transform:translateY(1px)}button:disabled{opacity:.4;cursor:default}
#mobile{position:absolute;inset:0;pointer-events:none;display:none}
#stick{position:absolute;left:3%;bottom:5%;width:100px;height:100px;border-radius:50%;background:#b6d4ff20;border:2px solid #b6d4ff70;pointer-events:auto}
#nub{position:absolute;left:29px;top:29px;width:38px;height:38px;border-radius:50%;background:#b6d4ff8a;border:1px solid #fff9}
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:#050914c9;pointer-events:auto;padding:12px}
.panel{width:min(92%,620px);max-height:92%;overflow:auto;background:linear-gradient(145deg,#202d4b,#121a2d);border:1px solid #7185b5;border-radius:18px;padding:clamp(14px,2.4vw,26px);box-shadow:0 16px 50px #0009}
h1{font-size:clamp(22px,3.6vw,38px);margin:0 0 4px;color:var(--gold)}h2{margin:0 0 12px;font-size:clamp(18px,2.4vw,24px)}p{line-height:1.55;color:#d5def3;margin:8px 0 14px}
#choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:9px}
.choice{text-align:left;min-height:100px;padding:12px;border-radius:12px;background:#263655;border:1px solid #536a9a}
.choice strong{display:block;color:var(--gold);font-size:16px;margin-bottom:5px}.choice small{color:#d5def3;line-height:1.4}
.panelrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.panelrow button{flex:1}
#netstatus{position:absolute;left:50%;top:2%;transform:translateX(-50%);background:#10182bd9;border:1px solid #7185b5;border-radius:9px;padding:5px 9px;font-size:12px;display:none;pointer-events:none;white-space:nowrap}
.lobbyinput{width:100%;padding:10px;border-radius:9px;border:1px solid #6076a4;background:#10182b;color:#fff;font:inherit;margin:4px 0 10px;text-transform:uppercase}
#toast{position:absolute;top:20%;left:50%;transform:translateX(-50%);background:#111a2bdf;border:1px solid #7185b5;border-radius:12px;padding:8px 14px;display:none;pointer-events:none;text-align:center;max-width:80%}
#bossbar{position:absolute;left:20%;right:20%;top:1.5%;display:none;text-align:center;font-size:12px;text-shadow:0 2px 3px #000}
#bossbar .bar{height:10px;border:1px solid #e8a5ff}
@media(max-width:700px){#stats{min-width:142px;padding:5px 7px}#topbuttons{top:11%;right:1%;gap:3px}#topbuttons button{padding:6px 7px;font-size:11px}#mobile{display:block}#stick{width:82px;height:82px}#nub{left:23px;top:23px;width:32px;height:32px}#money{top:1.5%;right:1%;padding:5px 7px}#bossbar{left:26%;right:26%;top:14%}}
@media(max-width:430px){#stats{max-width:48%}#topbuttons{top:12%}}

#overlay.title-overlay{background:radial-gradient(ellipse at 50% 20%,#253d6ff0,#070b16f5 78%)}
#overlay.title-overlay .panel{width:min(94%,700px);text-align:center;border:1px solid #7b8fff;background:linear-gradient(150deg,#1c2e50f7,#101727fa 65%,#251c43f7);box-shadow:0 0 0 4px #8c9fff12,0 0 45px #527dff35,0 18px 60px #000b;padding:clamp(18px,4vw,38px)}
.title-hero{position:relative;padding:12px 8px 18px;margin:-4px 0 12px;border-radius:14px;background:linear-gradient(120deg,#2a4e7c66,#7a4caa33,#18294b66);border:1px solid #91a9ff40}
.title-mark{font-size:clamp(36px,8vw,68px);line-height:1.15;filter:drop-shadow(0 0 14px #70d9ff70);margin-bottom:6px}
.title-name{font-size:clamp(27px,5.8vw,48px);font-weight:950;letter-spacing:.04em;line-height:1.12;color:#fff;text-shadow:0 0 10px #6b9dff,0 3px 0 #233963;margin:0 0 8px}
.title-sub{font-size:clamp(12px,2vw,16px);letter-spacing:.12em;color:#9deaff;margin:0 0 8px}
.title-tags{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:12px 0 2px}.title-tags span{font-size:12px;padding:5px 9px;border-radius:999px;background:#1b2c49;border:1px solid #6582b7;color:#d9e7ff}
#overlay.title-overlay .panelrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;margin-top:18px}
#overlay.title-overlay .panelrow button{min-height:48px;font-weight:750;background:linear-gradient(180deg,#334b78,#243351);border-color:#8da7e0}
#overlay.title-overlay .panelrow button:first-child{background:linear-gradient(180deg,#2c9fcb,#2462a5);border-color:#a3efff;box-shadow:0 0 18px #31a8ff35}
@media(max-width:520px){#overlay.title-overlay .panelrow{grid-template-columns:1fr}#overlay.title-overlay .panel{width:96%;padding:15px}}

</style>
</head>
<body>
<div id="wrap"><div id="game">
<canvas id="cv" width="960" height="540" aria-label="MY RPG WORLD game"></canvas>
<div id="hud">
 <div id="stats" class="hudbox">
  <div><b>MY RPG WORLD</b>　Lv.<span id="lv">1</span></div><div>敵撃破 <span id="kills">0</span>体</div>
  <div class="bar"><div id="hpfill" class="fill" style="background:#ff6483"></div></div>
  <div>HP <span id="hp">100</span>/<span id="maxhp">100</span></div>
  <div class="bar"><div id="xpfill" class="fill" style="background:#67e8a5;width:0%"></div></div>
  <div>EXP <span id="xp">0</span>/<span id="nextxp">30</span></div>
 </div>
 <div id="bossbar"><b>👑 BOSS</b><div class="bar"><div id="bossfill" class="fill" style="background:#d86bff"></div></div></div>
 <div id="topbuttons"><button id="fullscreenBtn" aria-label="全画面表示">⛶ 全画面</button><button id="pauseBtn">Ⅱ</button></div>

 <div id="mobile"><div id="stick"><div id="nub"></div></div></div>
 <div id="netstatus"></div><div id="toast"></div>
</div>
<div id="overlay"><div class="panel"><div id="panelcontent"></div></div></div>
</div></div>
<script src="https://game-cdn.poki.com/scripts/v2/poki-sdk.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id), cv=$('cv'),ctx=cv.getContext('2d');
const W=960,H=540;
let mode='title',last=0,time=0,spawnT=0,toastT=0,bossSpawned=false,levelPending=0,killCount=0;
let keys={},joy={x:0,y:0},effects=[],enemies=[],shots=[],coinsDrops=[],floaters=[];
let orbitAngle=0,orbitHitTimers=new Map();
const obstacleTileW=300,obstacleTileH=260; // 無限世界の障害物タイル
const orbitDefaults={count:2,damage:8, speed:2.7, radiusX:43, radiusY:30};
let orbitBalls={...orbitDefaults};
const player={x:W/2,y:H/2,r:15,hp:100,maxHp:100,speed:205,damage:12,range:235,fireRate:.55,fireT:0,xp:0,nextXp:30,level:1,armor:0,regen:0};
const skillDefs={
 flame:{name:'炎爆',emoji:'🔥',cd:5.5,desc:'周囲の敵全体に大ダメージ。',unlock:1},
 lightning:{name:'雷撃',emoji:'⚡',cd:4.5,desc:'近くの敵3体までに連鎖ダメージ。',unlock:1},
 frost:{name:'氷結',emoji:'❄️',cd:7,desc:'周囲を凍らせ、敵をしばらく遅くする。',unlock:1},
 ultimate:{name:'必殺技',emoji:'💥',cd:20,desc:'画面内の敵に超大ダメージ。Lv.5で解放。',unlock:5}
};
let cooldowns={flame:0,lightning:0,frost:0,ultimate:0};
let learned={flame:false,lightning:false,frost:false,ultimate:false};
let upgrades={power:0,swift:0,heart:0,armor:0,regen:0};
// レベルアップで選べる一度きりのランダム能力。取得済み能力は二度と候補に出ず、重ねて強化できない。
const abilityDefs=[
 {id:'powerCore',name:'💥 火力コア',desc:'攻撃ダメージが一度だけ大幅アップ。',apply:()=>{player.damage*=1.35;}},
 {id:'swiftBoots',name:'👟 風のブーツ',desc:'移動速度が一度だけアップ。',apply:()=>{player.speed*=1.22;}},
 {id:'heartStone',name:'💖 命の石',desc:'最大HPが40増え、HPも回復。',apply:()=>{player.maxHp+=40;player.hp=Math.min(player.maxHp,player.hp+40);}},
 {id:'ironSkin',name:'🛡️ 鉄の肌',desc:'受けるダメージを一度だけ軽減。',apply:()=>{player.armor=Math.min(.7,player.armor+.15);}},
 {id:'longShot',name:'🎯 遠距離射撃',desc:'通常攻撃の射程が一度だけ伸びる。',apply:()=>{player.range+=75;}},
 {id:'rapidFire',name:'⚡ 連射装置',desc:'通常攻撃の間隔が一度だけ短くなる。',apply:()=>{player.fireRate=Math.max(.2,player.fireRate*.78);}},
 {id:'learnFlame',name:'🔥 技：炎爆',desc:'炎の技を習得。習得後は自動で発動する。',skill:'flame',apply:()=>{learned.flame=true;}},
 {id:'learnLightning',name:'✨ 技：光雷撃',desc:'光る雷の技を習得。習得後は自動で発動する。',skill:'lightning',apply:()=>{learned.lightning=true;}},
 {id:'learnFrost',name:'❄️ 技：氷結',desc:'新しい技を習得。以後、氷結が自動で発動する。',skill:'frost',apply:()=>{learned.frost=true;}},
 {id:'learnUltimate',name:'💥 技：必殺技',desc:'Lv.5以上で選択可能。習得すると必殺技が自動で発動する。',skill:'ultimate',unlock:5,apply:()=>{learned.ultimate=true;}},
 {id:'skillCore',name:'✨ 技の結晶',desc:'自動で発動する技の威力が一度だけアップ。',apply:()=>{player.skillPower=(player.skillPower||1)*1.4;}},
 {id:'regenHeart',name:'🌿 再生の心',desc:'HPが少しずつ回復する能力を一度だけ獲得。',apply:()=>{player.regen+=1.5;}},
 {id:'orbitCount',name:'🔮 回転球を1個追加',desc:'自分の周りを回る球が1個増える（最大8個）。',apply:()=>{orbitBalls.count=Math.min(8,orbitBalls.count+1);}},
 {id:'orbitPower',name:'💫 回転球の威力',desc:'回転する球の接触ダメージが大きくなる。',apply:()=>{orbitBalls.damage+=6;}},
 {id:'orbitSpeed',name:'🌀 回転速度アップ',desc:'周りを回る球がもっと速く回る。',apply:()=>{orbitBalls.speed+=1.1;}},
 {id:'orbitRange',name:'⭕ 回転範囲アップ',desc:'球が回る範囲が広くなる。',apply:()=>{orbitBalls.radiusX+=14;orbitBalls.radiusY+=10;}},
 {id:'heavyStrike',name:'🔨 重撃',desc:'通常攻撃のダメージがさらにアップ。',apply:()=>{player.damage*=1.22;}},
 {id:'quickHands',name:'🖐️ 連撃の手',desc:'通常攻撃の間隔が短くなる。',apply:()=>{player.fireRate=Math.max(.16,player.fireRate*.86);}},
 {id:'vitality',name:'❤️‍🔥 生命力',desc:'最大HPが25増え、HPも回復。',apply:()=>{player.maxHp+=25;player.hp=Math.min(player.maxHp,player.hp+25);}},
 {id:'guardian',name:'🧿 守護の結界',desc:'受けるダメージをさらに軽減。',apply:()=>{player.armor=Math.min(.75,player.armor+.08);}},
 {id:'swiftStep',name:'💨 疾風ステップ',desc:'移動速度がさらにアップ。',apply:()=>{player.speed*=1.12;}},
 {id:'longReach',name:'🏹 射程拡張',desc:'通常攻撃の射程がさらに伸びる。',apply:()=>{player.range+=45;}},
 {id:'regenBurst',name:'🌱 大回復',desc:'HPを最大HPの半分回復する。',apply:()=>{player.hp=Math.min(player.maxHp,player.hp+Math.ceil(player.maxHp*.5));}},
 {id:'orbForce',name:'🔮 球の増幅',desc:'回転球の接触ダメージがさらにアップ。',apply:()=>{orbitBalls.damage+=10;}}
];
let acquiredAbilities=[];
let skillProjectiles=[];
let sdkReady=false;
try{if(window.PokiSDK){PokiSDK.init().then(()=>{sdkReady=true;}).catch(()=>{});}}catch(e){}
function sdkCall(name){try{if(window.PokiSDK&&typeof PokiSDK[name]==='function')PokiSDK[name]();}catch(e){}}
function start(){reset();mode='play';$('overlay').style.display='none';if(peer)updateNetLabel();sdkCall('gameplayStart');}
function reset(){
 time=0;spawnT=0;bossSpawned=false;levelPending=0;killCount=0;enemies=[];shots=[];coinsDrops=[];floaters=[];effects=[];skillProjectiles=[];orbitAngle=0;orbitHitTimers=new Map();orbitBalls={...orbitDefaults};
 Object.assign(player,{x:W/2,y:H/2,r:15,hp:100,maxHp:100,speed:205,damage:12,range:235,fireRate:.55,fireT:0,xp:0,nextXp:30,level:1,armor:0,regen:0});
 cooldowns={flame:0,lightning:0,frost:0,ultimate:0};learned={flame:false,lightning:false,frost:false,ultimate:false};upgrades={power:0,swift:0,heart:0,armor:0,regen:0};acquiredAbilities=[];
}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';toastT=2.1;}
function getScore(){return killCount*10+player.level*100+Math.floor(time*2);}
function readRanking(){try{return JSON.parse(localStorage.getItem('myRpgWorldRanking')||'[]').filter(x=>x&&Number.isFinite(x.score));}catch(e){return [];}}
function saveRanking(){
 const row={name:(localStorage.getItem('myRpgPlayerName')||'冒険者').slice(0,16),score:getScore(),level:player.level,kills:killCount,time:Math.floor(time),date:new Date().toLocaleDateString('ja-JP')};
 const list=readRanking();list.push(row);list.sort((a,b)=>b.score-a.score);const top=list.slice(0,10);
 try{localStorage.setItem('myRpgWorldRanking',JSON.stringify(top));}catch(e){}
 // Firebase Realtime Database URLを設定している場合、端末をまたいでランキングを共有
 syncOnlineRanking(row).catch(()=>{});return top;
}
function getOnlineDbUrl(){return (localStorage.getItem('myRpgOnlineRankingUrl')||'').trim().replace(/\/$/,'');}
async function syncOnlineRanking(newRow){
 const base=getOnlineDbUrl();if(!base)return;
 const res=await fetch(base+'/rankings.json');if(!res.ok)throw new Error('オンラインランキングを読み込めません');
 const data=await res.json();let list=Array.isArray(data)?data:Object.values(data||{});
 if(newRow)list.push(newRow);
 list=list.filter(x=>x&&Number.isFinite(Number(x.score))).map(x=>({...x,score:Number(x.score),level:Number(x.level)||1,kills:Number(x.kills)||0,time:Number(x.time)||0}));
 list.sort((a,b)=>b.score-a.score);list=list.slice(0,10);
 const put=await fetch(base+'/rankings.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(list)});
 if(!put.ok)throw new Error('オンラインランキングを保存できません');
 try{localStorage.setItem('myRpgWorldRanking',JSON.stringify(list));}catch(e){}
 return list;
}
async function loadOnlineRanking(){
 const base=getOnlineDbUrl();if(!base)return null;
 const res=await fetch(base+'/rankings.json');if(!res.ok)throw new Error('オンラインランキングを読み込めません');
 const data=await res.json();const list=(Array.isArray(data)?data:Object.values(data||{})).filter(x=>x&&Number.isFinite(Number(x.score))).map(x=>({...x,score:Number(x.score),level:Number(x.level)||1,kills:Number(x.kills)||0,time:Number(x.time)||0})).sort((a,b)=>b.score-a.score).slice(0,10);
 try{localStorage.setItem('myRpgWorldRanking',JSON.stringify(list));}catch(e){}return list;
}
function rankingRows(list){if(!list.length)return '<p>まだ記録がないよ。冒険して最初の記録を作ろう！</p>';return '<div style="text-align:left;max-width:500px;margin:auto">'+list.map((r,i)=>`<div style="display:flex;gap:8px;justify-content:space-between;padding:8px;border-bottom:1px solid #46577e"><b>${i+1}. ${i===0?'👑 ':''}${escapeRankName(r.name||'冒険者')} ${r.score.toLocaleString()}点</b><span>Lv.${r.level} ・ ${r.kills}体 ・ ${r.time}秒</span></div>`).join('')+'</div>';}
function escapeRankName(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function rankingMarkup(){
 const list=readRanking();const base=getOnlineDbUrl();
 return '<div style="margin:0 auto 12px;max-width:500px;text-align:left"><label for="playerName">ランキングに表示する名前</label><input id="playerName" class="lobbyinput" maxlength="16" placeholder="冒険者" value="'+escapeRankName(localStorage.getItem('myRpgPlayerName')||'')+'"><label for="rankingDbUrl" style="display:block;margin-top:8px">オンラインランキング接続URL（Firebase）</label><input id="rankingDbUrl" class="lobbyinput" placeholder="https://あなたのDB名-default-rtdb.firebaseio.com" value="'+escapeRankName(base)+'"><button id="saveRankConfigBtn" style="width:100%;margin-top:8px">名前・オンライン設定を保存</button><button id="refreshOnlineRankingBtn" style="width:100%;margin-top:8px">🌐 オンラインランキングを読み込む</button><p id="rankingStatus" style="font-size:12px">'+(base?'オンラインランキングURL設定済み':'現在はこの端末内のランキング。オンライン共有にはFirebase URLの設定が必要です。')+'</p></div><div id="rankingRows">'+rankingRows(list)+'</div><p style="font-size:12px">オンライン共有を使うにはFirebase Realtime DatabaseのURLが必要です。URLを設定しない場合は端末内ランキングになります。</p>';
}
function openPanel(type){
 mode=type;sdkCall('gameplayStop');
 let c=$('panelcontent'),title='',body='',buttons='';
 if(type==='title'){
  title='';body='<div class="title-hero"><div class="title-mark">🌌 ⚔️ 🔮</div><div class="title-name">MY RPG WORLD</div><div class="title-sub">ENDLESS ADVENTURE</div><p>無限の世界を駆け抜け、敵とボスを倒して最強を目指そう！</p><div class="title-tags"><span>🌍 無限フィールド</span><span>🪨 障害物</span><span>✨ 能力3択</span><span>🏆 ランキング</span></div></div><p>移動：WASD／矢印キー／左スティック<br>攻撃・習得した技は自動で発動します。</p>';
  buttons='<button id="startBtn">▶ ひとりで遊ぶ</button><button id="multiBtn">🌐 オンライン最大4人</button><button id="rankingBtn">🏆 ランキングボード</button>';
  $('overlay').classList.add('title-overlay');
 }else if(type==='ranking'){ $('overlay').classList.remove('title-overlay');title='🏆 オンラインランキングボード';body=rankingMarkup();buttons='<button id="rankingBackBtn">戻る</button><button id="rankingClearBtn">この端末の記録を消す</button>'; 

 }else if(type==='lobby'){ $('overlay').classList.remove('title-overlay');
  title='🌐 オンライン協力プレイ';
  body='<p>最大4人で同じルームに参加できます。ホストがルームを作成し、友だちにルームコードを伝えてね。</p><button id="hostBtn" style="width:100%;margin-bottom:8px">ルームを作る</button><label for="roomCode">ルームコード</label><input id="roomCode" class="lobbyinput" maxlength="6" placeholder="例：A7K2Q9"><button id="joinBtn" style="width:100%">コードで参加</button><p id="netmsg">接続方式：Peer-to-peer（PeerJS）</p>';
  buttons='<button id="onlineStartBtn">▶ ゲーム開始</button><button id="lobbyBackBtn">戻る</button>';

  const size=8+Math.min(4,orbitBalls.damage*.12);
  const orbGlow=ctx.createRadialGradient(orbX,orbY,1,orbX,orbY,size*1.8);orbGlow.addColorStop(0,'#fff');orbGlow.addColorStop(.35,'#e2b6ff');orbGlow.addColorStop(1,'#9b4dff00');ctx.fillStyle=orbGlow;ctx.beginPath();ctx.arc(orbX,orbY,size*1.8,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#b56aff';ctx.beginPath();ctx.arc(orbX,orbY,size*.75,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#f5e7ff';ctx.lineWidth=2;ctx.stroke();
 }
 effects.forEach(e=>{
  if(e.type==='ring'){ctx.globalAlpha=Math.max(0,e.t/.9);ctx.strokeStyle=e.color;ctx.lineWidth=5;ctx.beginPath();ctx.arc(e.x,e.y,e.max*(1-e.t/(e.max===460?.9:e.max===220?.55:e.max===185?.42:.25)),0,Math.PI*2);ctx.stroke();ctx.globalAlpha=1;}
  if(e.type==='burst'){ctx.globalAlpha=Math.max(0,e.t/.25);ctx.fillStyle=e.color;ctx.beginPath();ctx.arc(e.x,e.y,e.r*(1-e.t/.25),0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}
  if(e.type==='bolt'){ctx.globalAlpha=Math.max(0,e.t/.18);ctx.strokeStyle=e.color;ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x1,e.y1);for(let i=1;i<6;i++){let t=i/6;ctx.lineTo(e.x1+(e.x2-e.x1)*t+(Math.random()-.5)*18,e.y1+(e.y2-e.y1)*t+(Math.random()-.5)*18);}ctx.lineTo(e.x2,e.y2);ctx.stroke();ctx.globalAlpha=1;}
 });
 floaters.forEach(f=>{ctx.globalAlpha=Math.min(1,f.t*2);ctx.fillStyle='#fff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(f.text,f.x,f.y);ctx.textAlign='left';ctx.globalAlpha=1;});
 ctx.restore();
 // vignette is fixed to the screen, not the world.
 const gr=ctx.createRadialGradient(W/2,H/2,150,W/2,H/2,600);gr.addColorStop(0,'#0000');gr.addColorStop(1,'#03071188');ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
}
function loop(ts){let dt=Math.min(.035,(ts-last)/1000||0);last=ts;update(dt);draw();requestAnimationFrame(loop);}
document.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();keys[e.key]=true;keys[k]=true;
 if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
 if(k==='escape'||k==='p'){if(mode==='play')openPanel('pause');else if(mode==='pause'){$('overlay').style.display='none';mode='play';sdkCall('gameplayStart');}}
 if(k==='b'&&mode==='play')openPanel('shop');
});
document.addEventListener('keyup',e=>{delete keys[e.key];delete keys[e.key.toLowerCase()];});
$('pauseBtn').onclick=()=>{if(mode==='play')openPanel('pause');};
$('fullscreenBtn').onclick=async()=>{try{if(!document.fullscreenElement){await $('game').requestFullscreen();}else{await document.exitFullscreen();}}catch(e){toast('このブラウザでは全画面表示に対応していない場合があります');}};
document.addEventListener('fullscreenchange',()=>{$('fullscreenBtn').textContent=document.fullscreenElement?'⛶ 戻す':'⛶ 全画面';});
let stick=$('stick'),nub=$('nub'),pointer=null;
stick.addEventListener('pointerdown',e=>{pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e);});
stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e);});
function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;let x=(e.clientX-cx)/(r.width*.34),y=(e.clientY-cy)/(r.height*.34),m=Math.hypot(x,y);if(m>1){x/=m;y/=m;}joy={x,y};nub.style.left=(29+x*22)+'px';nub.style.top=(29+y*22)+'px';}
function releaseStick(e){if(pointer===e.pointerId){pointer=null;joy={x:0,y:0};nub.style.left='29px';nub.style.top='29px';}}
stick.addEventListener('pointerup',releaseStick);stick.addEventListener('pointercancel',releaseStick);
window.addEventListener('blur',()=>{keys={};joy={x:0,y:0};});

// Online room: up to four peers via PeerJS. Positions and status are synchronized.
let peer=null, roomHost=false, roomId='', connections=[], remotePlayers={}, netTick=0, netStatusTimer=0;
function setNetStatus(msg,show=true){const el=$('netstatus');el.textContent=msg;el.style.display=show?'block':'none';}
function playerCount(){return 1+connections.filter(c=>c.open).length;}
function updateNetLabel(){setNetStatus(`🌐 オンライン ${playerCount()}/4人${roomId?' ・ ROOM '+roomId:''}`,true);}
function setupConnection(conn){
 if(connections.length>=3){try{conn.close();}catch(e){}return;}
 connections.push(conn);
 conn.on('open',()=>{if(connections.filter(c=>c.open).length>3){conn.close();return;}remotePlayers[conn.peer]={x:W/2,y:H/2,level:1};conn.send({type:'hello',room:roomId,host:roomHost});updateNetLabel();toast('プレイヤーが参加した！');});
 conn.on('data',msg=>{
  if(!msg||typeof msg!=='object')return;
  if(msg.type==='state'&&msg.player){remotePlayers[conn.peer]={x:msg.player.x,y:msg.player.y,level:msg.player.level||1};}
  if(msg.type==='hello'){conn.send({type:'state',player:{x:player.x,y:player.y,level:player.level}});}
  if(msg.type==='leave'){delete remotePlayers[conn.peer];}
 });
 conn.on('close',()=>{connections=connections.filter(c=>c!==conn);delete remotePlayers[conn.peer];updateNetLabel();});
 conn.on('error',()=>{delete remotePlayers[conn.peer];});
}
function hostRoom(){
 if(!window.Peer){$('netmsg').textContent='通信ライブラリを読み込めませんでした。ネット接続を確認してね。';return;}
 disconnectNet();roomId=Math.random().toString(36).slice(2,8).toUpperCase();roomHost=true;
 peer=new Peer('myrpg-'+roomId,{debug:0});
 $('netmsg').textContent='ルームを作成中…';
 peer.on('open',()=>{$('netmsg').innerHTML=`ルーム作成完了！友だちにこのコードを送ってね：<b style="color:#ffd76a;font-size:22px">${roomId}</b><br>参加者が接続したら「開始」を押してね。`;});
 peer.on('connection',conn=>{if(connections.filter(c=>c.open).length>=3){conn.on('open',()=>conn.close());return;}setupConnection(conn);});
 peer.on('error',e=>{$('netmsg').textContent='ルーム作成に失敗しました。別のルームを作ってね。';});
}
function joinRoom(code){
 if(!code||code.length<4){$('netmsg').textContent='ルームコードを入力してね。';return;}
 if(!window.Peer){$('netmsg').textContent='通信ライブラリを読み込めませんでした。';return;}
 disconnectNet();roomId=code;roomHost=false;peer=new Peer({debug:0});
 $('netmsg').textContent='ルームに接続中…';
 peer.on('open',()=>{const conn=peer.connect('myrpg-'+roomId,{reliable:true});setupConnection(conn);conn.on('open',()=>{$('netmsg').textContent='接続成功！ ゲームを開始します。';setTimeout(()=>{if(mode==='lobby')start();},700);});});
 peer.on('error',()=>{$('netmsg').textContent='接続できません。コードを確認して、ホストがルームを開いているか確認してね。';});
}
function disconnectNet(){
 try{connections.forEach(c=>c.close());if(peer)peer.destroy();}catch(e){}
 connections=[];remotePlayers={};peer=null;roomId='';roomHost=false;
}
function networkTick(dt){
 if(!peer||!peer.open)return;
 netTick+=dt;if(netTick<.08)return;netTick=0;
 const msg={type:'state',player:{x:player.x,y:player.y,level:player.level}};
 connections.forEach(c=>{if(c.open)try{c.send(msg);}catch(e){}});
}

function init(){openPanel('title');updateHUD();requestAnimationFrame(loop);try{if(window.PokiSDK)sdkCall('gameLoadingFinished');}catch(e){}}
init();
})();
</script>
